version: "3.8"

services:
  redis:
    image: redis:8.8.1-trixie
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  prometheus:
    image: prom/prometheus:main-distroless
    ports:
      - "9090:9090"
    volumes:
    - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - ./monitoring/grafana/provisioning/datasource:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: hdp-order-service/dockerfile
    image: hdp-order-service:latest
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      # DB: order-db:5432 is the in-container port (host port 5433 is for the
      # host machine only).
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: hdp_user
      DB_PASSWORD: postgres
      # Kafka: use the internal listener, not the host-mapped one.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecommerce-net

  order-db:
    image: postgres:18.3
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: hdp_user
      POSTGRES_DB: order_db
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - order_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdp_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  product-db:
    image: postgres:18.3
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: hdp_user
      POSTGRES_DB: product_db
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - product_data:/var/lib/postgresql
    networks:
      - ecommerce-net

  customer-service:
    build:
      context: .
      dockerfile: hdp-customer-service/dockerfile
    image: hdp-customer-service:latest
    container_name: customer-service
    ports:
      - "8082:8082"
    environment:
      # DB: customer-db:5432 is the in-container port (host port 5435 is for the
      # host machine only).
      DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      DB_USERNAME: hdp_user
      DB_PASSWORD: postgres
    depends_on:
      customer-db:
        condition: service_healthy
    networks:
      - ecommerce-net

  customer-db:
    image: postgres:18.3
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: hdp_user
      POSTGRES_DB: customer_db
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - customer_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdp_user -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - ecommerce-net

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

    depends_on:
      - kafka
    networks:
      - ecommerce-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG_APPEND_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_KAFKASTORE_MIN_INSYNC_REPLICAS: 1
    depends_on:
      - kafka
    networks:
      - ecommerce-net

volumes:
  order_data:
  product_data:
  customer_data:
  grafana-data:
  redis_data:

networks:
  ecommerce-net:
    driver: bridge
