plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'Infrastructure configuration for HDP microservices'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    set('lombokVersion', '1.18.42')
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    implementation project(':hdp-common-core')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation("org.springframework.boot:spring-boot-starter-jackson:4.0.0")
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'hdp-common-infrastructure'
                description = 'Infrastructure configuration for HDP microservices'
            }
        }
    }
    repositories {
        mavenLocal()
    }
}