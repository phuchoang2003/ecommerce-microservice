plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'Messaging library with Kafka + Avro support'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('confluentVersion', '7.5.0')
    set('avroVersion', '1.11.3')
    set('lombokVersion', '1.18.42')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://packages.confluent.io/maven/' }
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // Spring Kafka
    api 'org.springframework.kafka:spring-kafka'

    // Confluent Schema Registry & Avro
    // Exclude legacy swagger-annotations:2.1.10 — it shares the same FQN
    // (io.swagger.v3.oas.annotations.media.Schema) as swagger-annotations-jakarta
    // but lacks requiredMode() (added in 2.2.0). On a Boot 4.x + springdoc
    // classpath the older artifact wins, causing NoSuchMethodError on the
    // /v3/api-docs endpoint. The -jakarta 2.2.27 brought in by springdoc
    // is a drop-in superset, so dropping the old one is safe.
    api("io.confluent:kafka-avro-serializer:${confluentVersion}") {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    api "org.apache.avro:avro:${avroVersion}"

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter:4.0.5'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'hdp-common-messaging'
                description = 'Messaging library with Kafka + Avro support'
            }
        }
    }
    repositories {
        mavenLocal()
    }
}