## =============================================================================
## Copy this file to the config repo:
##   github.com/phuchoang2003/ecommerce-config-repo
##   → services/hdp-customer-service.yml   (default profile)
##   → services/hdp-customer-service/local.yml   (local profile, optional)
##
## The bootstrap application.yml in the service already has:
##   - spring.application.name: hdp-customer-service
##   - spring.config.import: configserver:http://localhost:8888
##   - spring.profiles.active: ${SPRING_PROFILES_ACTIVE:default}
## So this file is the "default" profile config that the service will pull
## from the config server at startup.
## =============================================================================

server:
  port: 8082
  shutdown: graceful
  servlet:
    context-path: /api

# ---------------------------------------------------------------------------
# Datasource — config is taken from env vars in docker-compose
# (DB_URL, DB_USERNAME, DB_PASSWORD). Defaults work for local `bootRun`.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/customer_db}
    username: ${DB_USERNAME:hdp_user}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ---------------------------------------------------------------------------
# Eureka discovery
# ---------------------------------------------------------------------------
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Actuator — health checks for k8s / monitoring
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ---------------------------------------------------------------------------
# Springdoc / OpenAPI
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

info:
  app:
    name: hdp-customer-service
    role: microservice
    description: User profile management — create, update, soft-delete users
