plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'HDP shared library — domain primitives, web, infrastructure, observability'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    set('lombokVersion', '1.18.42')
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // Web (formerly hdp-common-web)
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // Infrastructure (formerly hdp-common-infrastructure)
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-jackson:4.0.0'
    api 'org.apache.commons:commons-pool2'

    // Observability (formerly hdp-common-observability)
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.micrometer:micrometer-core'

    api 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'hdp-library'
                description = 'HDP shared library — domain primitives, web, infrastructure, observability'
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.named('generateMetadataFileForMavenJavaPublication') {
    suppressedValidationErrors.add('dependencies-without-versions')
}
