plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'HDP shared library — domain primitives, web, infrastructure, observability'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    set('lombokVersion', '1.18.42')
    set('confluentVersion', '7.5.0')
    set('avroVersion', '1.11.3')
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
    maven { url 'https://packages.confluent.io/maven/' }
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // Web (formerly hdp-common-web)
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // Infrastructure (formerly hdp-common-infrastructure)
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-jackson:4.0.0'

    // Observability (formerly hdp-common-observability)
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.micrometer:micrometer-core'

    // Persistence — DataSource proxy + SQL comments (formerly hdp-common-persistence)
    api 'com.github.gavlyukovskiy:datasource-proxy-spring-boot-starter:2.0.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Messaging — Kafka + Avro (formerly hdp-common-messaging)
    compileOnly 'org.springframework.kafka:spring-kafka'
    // Confluent Avro serializer pulls swagger-annotations:2.1.10 which conflicts
    // with swagger-annotations-jakarta:2.2.27 from springdoc on Boot 4.x
    // (NoSuchMethodError on requiredMode at /v3/api-docs). Drop the legacy one.
    compileOnly("io.confluent:kafka-avro-serializer:${confluentVersion}") {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    compileOnly "org.apache.avro:avro:${avroVersion}"

    api 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'hdp-library'
                description = 'HDP shared library — domain primitives, web, infrastructure, observability'
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.named('generateMetadataFileForMavenJavaPublication') {
    suppressedValidationErrors.add('dependencies-without-versions')
}
