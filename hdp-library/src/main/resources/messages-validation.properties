# Validation Messages
validation.notNull=is required
validation.notEmpty=must not be empty
validation.notBlank=must not be blank
validation.min=must be greater than or equal to {1}
validation.max=must be less than or equal to {1}
validation.size=size must be between {1} and {2}
validation.email=is invalid email
validation.pattern=does not match pattern
validation.decimalMin=must be greater than or equal to {1}
validation.decimalMax=must be less than or equal to {1}
validation.positive=must be positive
validation.positiveOrZero=must be positive or zero
validation.negative=must be negative
validation.negativeOrZero=must be negative or zero
validation.past=must be in the past
validation.future=must be in the future
validation.enum.invalid=invalid value. Must be one of {0}
validation.file.contentTypeNotAllowed=content type not allowed. Allowed: jpeg, png, gif, webp
validation.file.extensionNotAllowed=file extension not allowed. Allowed: jpg, jpeg, png, gif, webp
validation.file.pathTraversal=file name must not contain path traversal sequences
