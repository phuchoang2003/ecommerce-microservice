plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'Order Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('lombokVersion', '1.18.42')
    set('archunitVersion', '1.3.0')
    // JUnit 6 and Mockito are managed by the Spring Boot 4.0.5 BOM via
    // spring-boot-starter-test — do not pin them here. Earlier pinning of
    // junitVersion=5.11.0 caused NoSuchMethodError at runtime because Spring
    // 7.0.x (transitive via Boot 4.0.5) calls JUnit 6 APIs.
    set('testcontainersVersion', '1.20.4')
}

// `sourceSets.integrationTest` auto-creates `integrationTestImplementation` and
// `integrationTestRuntimeOnly` configurations. We declare the source set FIRST,
// then in the configurations block we use `named(...)` to extend the auto-created
// configs with the test classpath. We also explicitly wire the main project's
// compile/runtime classpath so cross-module deps (e.g. hdp-common-messaging) and
// the main source set's own classes are visible to the IT compiler.
sourceSets {
    integrationTest {
        java.srcDir 'it/java'
        resources.srcDir 'it/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    named('integrationTestImplementation') {
        extendsFrom testImplementation, implementation
    }
    named('integrationTestRuntimeOnly') {
        extendsFrom testRuntimeOnly, runtimeOnly
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://packages.confluent.io/maven/' }
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // HDP Common libraries
    implementation project(':hdp-common-core')
    implementation project(':hdp-common-web')
    implementation project(':hdp-common-infrastructure')
    implementation project(':hdp-common-persistence')
    implementation project(':hdp-common-messaging')
    implementation project(':hdp-common-observability')
    implementation project(':hdp-common-test')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'



    // Flyway for database migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL JDBC driver
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok for convenience in test helpers
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ArchUnit for architecture testing
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Spring Boot test — BOM brings JUnit 6, Mockito, AssertJ, Spring TestContext.
    // Do NOT pin JUnit/Mockito versions; they must align with the BOM (Boot 4.0.5).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Spring Kafka test (EmbeddedKafkaBroker, @EmbeddedKafka)
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // Testcontainers (Postgres + JUnit5 extension)
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"

    // ---- integrationTest source set (it/java + it/resources) ----
    // IT tests are NOT picked up by `./gradlew test` or `./gradlew build`.
    // Run them explicitly with `./gradlew integrationTest`.
    integrationTestImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    integrationTestImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'hdp-order-service-0.0.1-SNAPSHOT.jar'
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (Testcontainers, full Spring context).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()

    // Sensible defaults for tests that boot a Spring context + DB container.
    // Override with -Pit.test.timeout=10m if a suite needs more.
    systemProperty 'junit.jupiter.execution.timeout.default', project.findProperty('it.test.timeout') ?: '5m'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}

