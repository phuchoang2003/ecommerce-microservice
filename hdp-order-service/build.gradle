plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'Order Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('lombokVersion', '1.18.42')
    set('archunitVersion', '1.3.0')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://packages.confluent.io/maven/' }
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // HDP Common libraries
    implementation project(':hdp-common-core')
    implementation project(':hdp-common-web')
    implementation project(':hdp-common-infrastructure')
    implementation project(':hdp-common-persistence')
    implementation project(':hdp-common-messaging')
    implementation project(':hdp-common-test')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'


    // Flyway for database migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL JDBC driver
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok for convenience in test helpers
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ArchUnit for architecture testing
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
