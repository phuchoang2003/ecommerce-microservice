spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}  # JDBC URL tới PostgreSQL
    username: ${DB_USERNAME:hdp_user}                         # DB username
    password: ${DB_PASSWORD:postgres}                         # DB password
    driver-class-name: org.postgresql.Driver                  # PostgreSQL JDBC driver

    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED       # transaction isolation level
      initialization-fail-timeout: 1                          # fail fast khi không thể
      pool-name: HikariCP                                     # Tên pool (dùng cho log/monitoring)
      minimum-idle: 5                                         # Số connection idle tối thiểu luôn giữ sẵn
      maximum-pool-size: 20                                   # Số connection tối đa trong pool

      idle-timeout: 300000                                    # (5 phút) connection idle quá lâu sẽ bị đóng
      connection-timeout: 30000                               # (30s) timeout khi chờ lấy connection từ pool
      validation-timeout: 5000


      # (5s) timeout khi validate connection còn sống

      max-lifetime: 1800000                                   # (30 phút) tuổi tối đa của connection → quá sẽ bị recycle
#      auto-commit: true                                       # auto commit mỗi query (default, Hibernate thường override)

      # Leak detection (DEV ONLY)
      leak-detection-threshold: 60000                         # (60s) log warning nếu connection không được trả lại pool

      # Keep connection sống (tránh bị firewall/DB kill khi idle)
      keepalive-time: 100000                                  # (~1.6 phút) ping connection idle định kỳ

      #     register-mbeans: true                                   # expose JMX metrics (dùng cho monitoring/debug)

      data-source-properties:
        # ===== Connection Pooling (driver-level) =====
        # ===== Batch Statements (driver-level) =====
        reWriteBatchedInserts: true

        # ===== Prepared Statement Cache (driver-level) =====
        preparedStatementCacheQueries: 256                    # số lượng query được cache
        preparedStatementCacheSizeMiB: 5                      # dung lượng cache (MB)
        prepareThreshold: 3                                   # sau n queries, prepared statement + cache
        # ===== Network / Protocol optimization =====
        binaryTransfer: true                                  # dùng binary protocol → nhanh hơn text
        tcpKeepAlive: true                                    # giữ TCP connection sống (OS-level)

        # ===== Timeout control =====
        socketTimeout: 30                                     # (30s) timeout khi query DB (tránh treo)
        connectTimeout: 10                                    # (10s) timeout khi tạo connection mới
        stringtype: unspecified                               # stringtype của column (default, Hibernate thường override)
      auto-commit: false                                      # auto commit khi commit/rollback
