plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.hdp'
version = '0.0.1-SNAPSHOT'
description = 'Product Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('lombokVersion', '1.18.42')
    set('confluentVersion', '7.5.0')
    set('avroVersion', '1.11.3')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://packages.confluent.io/maven/' }
}

configurations.all {
    resolutionStrategy {
        force "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    // HDP Common libraries
    implementation project(':hdp-library')

    // Spring Cloud Config client — pulls config from hdp-config-server on startup
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Inlined from hdp-common-messaging (formerly common) — Kafka + Avro
    implementation 'org.springframework.kafka:spring-kafka'
    // Confluent Avro serializer pulls swagger-annotations:2.1.10 which conflicts
    // with swagger-annotations-jakarta:2.2.27 from springdoc on Boot 4.x
    // (NoSuchMethodError on requiredMode at /v3/api-docs). Drop the legacy one.
    implementation("io.confluent:kafka-avro-serializer:${confluentVersion}") {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    implementation "org.apache.avro:avro:${avroVersion}"

    // Flyway for database migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL JDBC driver
    runtimeOnly 'org.postgresql:postgresql'

    // AWS SDK for S3 file storage (inlined from hdp-common-file-storage)
    implementation 'software.amazon.awssdk:s3:2.44.7'
    implementation 'software.amazon.awssdk:sts:2.44.7'

    // Lombok for convenience in test helpers
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test scope
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}